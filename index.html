<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análisis de Mercado Café MDQ</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #map { height: 100vh; width: 100%; }
        
        #control-panel {
            position: absolute;
            top: 15px;
            right: 15px;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 1000;
            width: 200px;
        }
        
        select { padding: 8px; font-size: 14px; margin-top: 10px; width: 100%; cursor: pointer;}
        h3 { margin: 0 0 10px 0; font-size: 16px; color: #333;}
    </style>
</head>
<body>

    <div id="control-panel">
        <h3>Filtro de Calor</h3>
        <select id="indice-selector">
            <option value="Indice Flat">Índice Flat White</option>
            <option value="Indice Cortado">Índice Cortado</option>
            <option value="Indice Expresso">Índice Espresso</option>
        </select>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

    <script>
        const map = L.map('map').setView([-38.005, -57.545], 13);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap & CARTO',
            maxZoom: 19
        }).addTo(map);

        let heatLayer;
        let cafesData = [];

        const sheetId = '1RLFtalcyVO_sKGdx8zY80bDFGJDZ4PTfPV_tAPEN-dU'; 
        const gid = '1166583340';
        const csvUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv&gid=${gid}`;

        Papa.parse(csvUrl, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                const data = results.data;
                console.log("Datos crudos de Google Sheets:", data); // Presioná F12 en tu navegador para ver si llegan los datos
                
                data.forEach(row => {
                    // FIX: Reemplazar comas por puntos en las coordenadas
                    let rawLat = row.LAT ? row.LAT.toString().replace(',', '.') : '';
                    let rawLng = row.LONG ? row.LONG.toString().replace(',', '.') : '';
                    
                    const lat = parseFloat(rawLat);
                    const lng = parseFloat(rawLng);
                    
                    let rawFlat = row['Indice Flat'] ? row['Indice Flat'].toString().replace(',', '.') : '0';
                    let rawCortado = row['Indice Cortado'] ? row['Indice Cortado'].toString().replace(',', '.') : '0';
                    let rawExpresso = row['Indice Expresso'] ? row['Indice Expresso'].toString().replace(',', '.') : '0';

                    const idxFlat = parseFloat(rawFlat);
                    const idxCortado = parseFloat(rawCortado);
                    const idxExpresso = parseFloat(rawExpresso);
                    
                    if (!isNaN(lat) && !isNaN(lng) && !isNaN(idxFlat) && idxFlat > 0 && idxFlat < 5) {
                        
                        cafesData.push({
                            lat: lat,
                            lng: lng,
                            'Indice Expresso': idxExpresso,
                            'Indice Cortado': idxCortado,
                            'Indice Flat': idxFlat
                        });

                        const marker = L.marker([lat, lng]).addTo(map);
                        
                        // Armado del popup integrando el Instagram
                        let popupHTML = `
                            <strong style="font-size:14px;">${row.CAFE}</strong><br>
                            <span style="color:gray;">Zona: ${row.ZONA}</span><br>
                        `;
                        
                        if(row.INSTAGRAM && row.INSTAGRAM.trim() !== '') {
                            popupHTML += `<a href="${row.INSTAGRAM}" target="_blank" style="font-size:12px; color:#d62976; text-decoration:none;">📷 Ver Instagram</a><br>`;
                        }
                        
                        popupHTML += `
                            <hr style="margin:5px 0;">
                            Precio Flat: <strong>$${row.Flat}</strong><br>
                            Índice Local: <strong>${idxFlat}</strong>
                        `;

                        marker.bindPopup(popupHTML);
                    }
                });

                renderHeatmap('Indice Flat');
            }
        });

        function renderHeatmap(columnaIndice) {
            if (heatLayer) {
                map.removeLayer(heatLayer);
            }

            const heatData = cafesData.map(cafe => {
                const intensidad = cafe[columnaIndice] || 1;
                return [cafe.lat, cafe.lng, intensidad];
            });

            heatLayer = L.heatLayer(heatData, {
                radius: 35,
                blur: 20,
                maxZoom: 15,
                max: 1.3,
                gradient: {0.4: 'blue', 0.6: 'cyan', 0.8: 'lime', 1.0: 'orange', 1.2: 'red'}
            }).addTo(map);
        }

        document.getElementById('indice-selector').addEventListener('change', function(e) {
            renderHeatmap(e.target.value);
        });
    </script>
</body>
</html>
